name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  apk:
    name: build apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: web 资源必须已同步
        run: |
          sh scripts/sync-web.sh
          if ! git diff --exit-code --stat; then
            echo "::error::android/ios/macos 里的 Web 资源与 web/ 不一致，本地跑 scripts/sync-web.sh 后一起提交"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: assemble debug
        run: gradle -p android --no-daemon assembleDebug

      - name: rename artifact
        run: |
          version=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle)
          suffix="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "bose-control-${version}-${suffix}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "bose-control-*.apk"
          if-no-files-found: error

  release:
    name: attach apk to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
          generate_release_notes: true
