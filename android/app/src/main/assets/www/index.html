<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>耳机</title>
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("gesturechange", (e) => e.preventDefault());
      document.addEventListener("gestureend", (e) => e.preventDefault());
      document.addEventListener("dblclick", (e) => e.preventDefault());
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener(
        "click",
        (e) => {
          if (window.__boseApp) return;
          if (e.target && e.target.id === "go") window.NativeBLE && window.NativeBLE.bleScan();
        },
        true,
      );
    </script>
  </head>
  <body>
    <header>
      <h1 id="status"></h1>
      <p id="meta"></p>
      <button id="go" type="button">
        <span id="go-text">连接</span>
        <i class="spin" aria-hidden="true"></i>
      </button>
      <p id="hint"></p>
    </header>
    <main id="controls" hidden>
      <section>
        <button class="fold" id="device-toggle" type="button" aria-expanded="false">
          <span class="fold-label">设备</span>
          <i class="chev" aria-hidden="true"></i>
        </button>
        <div id="info" hidden></div>
      </section>
      <section>
        <h2>音量</h2>
        <div id="volume"></div>
      </section>
      <section>
        <h2>模式</h2>
        <div id="modes" class="chips"></div>
      </section>
      <section>
        <h2>降噪</h2>
        <div id="cnc" class="levels"></div>
      </section>
      <section>
        <h2>均衡</h2>
        <div id="eq"></div>
      </section>
      <section>
        <h2>空间</h2>
        <div id="spatial" class="chips"></div>
      </section>
      <section>
        <h2>侧音</h2>
        <div id="sidetone" class="chips"></div>
      </section>
      <section>
        <div id="toggles" class="chips"></div>
      </section>
      <section>
        <h2>关机</h2>
        <div id="standby" class="chips"></div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
