<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bose Connector</title>
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css" />
    <script>
      document.addEventListener("gesturestart", (e) => e.preventDefault());
      document.addEventListener("gesturechange", (e) => e.preventDefault());
      document.addEventListener("gestureend", (e) => e.preventDefault());
      document.addEventListener("dblclick", (e) => e.preventDefault());
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      (function () {
        var chrome = (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || "?";
        function hint(text) {
          var paint = function () {
            document.body.classList.add("idle");
            var el = document.getElementById("hint");
            if (el) el.textContent = text;
          };
          if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", paint);
          else paint();
        }
        // 老 WebView 不支持 type="module"，app.js 根本不会执行，这里直接说清楚
        if (!("noModule" in HTMLScriptElement.prototype)) {
          hint("系统 WebView 太旧，请升级（Chromium " + chrome + "）");
          return;
        }
        // app.js 用了可选链等新语法，Chromium 80 以下会在解析阶段就挂掉
        try {
          new Function("return a?.b ?? c");
        } catch (err) {
          hint("系统 WebView 太旧，请升级（Chromium " + chrome + "）");
          return;
        }
        document.addEventListener(
          "click",
          (e) => {
            if (window.__boseApp) return;
            var go = e.target && e.target.closest && e.target.closest("#go");
            if (!go) return;
            hint("页面脚本没加载起来（Chromium " + chrome + "）");
            window.NativeBLE && window.NativeBLE.bleScan();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="screen" data-page="devices">
      <section class="screen-page current" id="page-devices">
        <header class="list-head">
          <h2 id="devices-title" data-label="devicesTitle"></h2>
          <button id="hub-refresh" type="button"></button>
        </header>
        <div id="hub" hidden></div>
        <div id="brand" class="chips" hidden></div>
        <button id="go-list" type="button">
          <span id="go-list-text">连接</span>
          <i class="spin" aria-hidden="true"></i>
        </button>
        <p id="hint"></p>
      </section>
      <section class="screen-page" id="page-device">
        <header>
          <div id="head">
            <button id="device-trigger" type="button" aria-controls="device-menu" hidden>
              <span id="status"></span>
              <span id="meta"></span>
              <i class="chev" aria-hidden="true"></i>
            </button>
          </div>
          <button id="back" type="button" hidden></button>
          <div id="device-menu" class="menu" role="menu"></div>
        </header>
        <div id="art-row" class="art-row" hidden></div>
        <main id="controls" hidden>
          <section>
            <h2 data-label="modes"></h2>
            <div id="modes" class="chips"></div>
          </section>
          <section id="mode-editor" hidden></section>
          <section>
            <h2 data-label="cnc"></h2>
            <div id="cnc" class="levels"></div>
          </section>
          <section>
            <h2 data-label="eq"></h2>
            <div id="eq"></div>
          </section>
          <section>
            <h2 data-label="spatial"></h2>
            <div id="spatial" class="chips"></div>
          </section>
          <section>
            <h2 data-label="sidetone"></h2>
            <div id="sidetone" class="chips"></div>
          </section>
          <section>
            <h2 data-label="others"></h2>
            <div id="toggles" class="chips"></div>
          </section>
          <section>
            <h2 data-label="playback"></h2>
            <div id="transport" class="chips"></div>
          </section>
          <section>
            <button id="settings-open" class="chip" type="button" data-label="settings"></button>
          </section>
        </main>
      </section>
    </div>
    <section id="settings">
      <div id="settings-head">
        <h1 data-label="settings"></h1>
        <button id="settings-close" type="button" class="chip" data-label="done"></button>
      </div>
      <section>
        <h2 data-label="language"></h2>
        <div id="lang" class="chips"></div>
      </section>
      <section>
        <h2 data-label="appearance"></h2>
        <div id="theme" class="chips"></div>
      </section>
      <section>
        <h2 data-label="name"></h2>
        <div id="rename" class="field"></div>
      </section>
      <section>
        <h2 id="shortcut-title"></h2>
        <div id="shortcut" class="chips"></div>
      </section>
      <section>
        <h2 data-label="favorites"></h2>
        <div id="favorites" class="chips"></div>
      </section>
      <section>
        <h2 data-label="voice"></h2>
        <div id="voice" class="chips"></div>
      </section>
      <section>
        <h2 data-label="others"></h2>
        <div id="behaviour" class="chips"></div>
      </section>
      <section>
        <h2 data-label="standby"></h2>
        <div id="standby" class="chips"></div>
      </section>
      <section>
        <h2 data-label="devices"></h2>
        <div id="devices" class="rows"></div>
      </section>
      <section>
        <h2 data-label="deviceInfo"></h2>
        <div id="info"></div>
      </section>
      <section>
        <h2 data-label="headset"></h2>
        <div class="chips">
          <div id="headset-actions" class="chips"></div>
          <button id="go" type="button">
            <span id="go-text">断开连接</span>
            <i class="spin" aria-hidden="true"></i>
          </button>
        </div>
      </section>
      <section>
        <h2 data-label="diag"></h2>
        <div id="diag" class="rows"></div>
      </section>
      <section>
        <h2 data-label="unverified"></h2>
        <div id="unverified" class="chips"></div>
        <p id="unverified-hint" data-label="unverifiedHint"></p>
      </section>
    </section>
    <script type="module" src="./app.js"></script>
  </body>
</html>
